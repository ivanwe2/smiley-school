<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Icon: book with a smiley -->
  <rect x="2" y="6" width="36" height="36" rx="8" fill="#F4B942"/>
  <!-- Book pages shadow -->
  <rect x="10" y="13" width="20" height="22" rx="2" fill="#0F1F3D" opacity="0.30"/>
  <!-- Book main -->
  <rect x="8" y="11" width="20" height="22" rx="2" fill="#0F1F3D"/>
  <!-- Smiley face on book -->
  <circle cx="13" cy="20" r="1.5" fill="#F4B942"/>
  <circle cx="21" cy="20" r="1.5" fill="#F4B942"/>
  <path d="M11.5 25 Q17 29 22.5 25" stroke="#F4B942" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Wordmark -->
  <text x="48" y="21" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#0F1F3D" letter-spacing="-0.3">Smiley</text>
  <text x="48" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" fill="#0F1F3D" letter-spacing="-0.3">School</text>
  <!-- Yellow accent dot -->
  <circle cx="107" cy="37" r="3" fill="#F4B942"/>
</svg>
